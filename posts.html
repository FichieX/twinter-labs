<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新動態 | Twinter Labs</title>
    <meta name="description" content="Twinter Labs 最新動態：新上線的網站與 APP 作品、開發進度與公告。">
    <link rel="canonical" href="https://www.twinterlabs.com/posts.html">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
        .font-display { font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; }
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; }

        /* Text of a single post (HTML comes from TLPosts.renderBody) */
        .post-body { color: #CBD5E1; font-size: 1rem; line-height: 1.9; overflow-wrap: anywhere; }
        .post-body p { margin: 0 0 1.1em; }
        .post-body h3 { font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif; color: #fff; font-size: 1.3rem; font-weight: 700; line-height: 1.35; margin: 1.8em 0 0.6em; }
        .post-body ul, .post-body ol { margin: 0 0 1.1em; padding-left: 1.5em; }
        .post-body ul { list-style: disc; }
        .post-body ol { list-style: decimal; }
        .post-body li { margin-bottom: 0.35em; }
        .post-body strong { color: #fff; font-weight: 700; }
        .post-body a { color: #22D3EE; text-decoration: underline; text-underline-offset: 3px; }
        .post-body a:hover { color: #67E8F9; }
    </style>
</head>
<body class="bg-[#080B11] text-slate-200 antialiased selection:bg-cyan-500 selection:text-black">

    <nav class="sticky top-0 z-50 bg-[#080B11]/90 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-3">
            <a href="index.html" id="homeLink" class="flex items-center gap-3 whitespace-nowrap">
                <div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-tr from-cyan-600 to-emerald-500 flex items-center justify-center font-display font-black text-xl text-black">
                    TL
                </div>
                <div class="hidden sm:block">
                    <span class="font-display text-lg font-bold text-white block">Twinter Labs</span>
                    <span class="text-[10px] text-cyan-400 font-mono block -mt-0.5" data-i18n="back_home">返回官網首頁 ←</span>
                </div>
            </a>
            <div class="flex items-center gap-2 sm:gap-2.5">
                <button type="button" onclick="toggleLanguage()" class="px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-cyan-500/40 text-xs font-mono font-bold text-cyan-300 hover:text-white transition flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-language text-sm text-cyan-400 hidden sm:inline"></i>
                    <span data-i18n="toggle_btn">English</span>
                </button>
                <a href="index.html#quick-request" id="orderLink" class="bg-cyan-500 hover:bg-cyan-400 text-black font-extrabold text-xs uppercase tracking-wider px-3 sm:px-5 py-2.5 rounded-xl transition whitespace-nowrap">
                    <span data-i18n="nav_cta">立即訂購</span> →
                </a>
            </div>
        </div>
    </nav>

    <main class="py-16 sm:py-20 px-6 min-h-[70vh]">

        <!-- All posts -->
        <div id="listView" class="max-w-7xl mx-auto hidden">
            <div class="text-center max-w-3xl mx-auto space-y-3 mb-14">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/80 border border-cyan-800/60 text-cyan-400 font-mono text-xs">
                    <i class="fa-solid fa-bullhorn"></i>
                    <span data-i18n="list_badge">最新動態 • 作品更新與公告</span>
                </div>
                <h1 class="font-display text-3xl sm:text-5xl font-bold text-white" data-i18n="list_title">Twinter Labs 最新動態</h1>
                <p class="text-slate-400 text-xs sm:text-sm leading-relaxed" data-i18n="list_desc">新上線的網站與 APP、開發中的專案進度，以及我們的最新消息。</p>
            </div>
            <div id="postGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <p id="emptyState" class="hidden text-center text-slate-500 font-mono text-sm py-16" data-i18n="empty">目前還沒有貼文，敬請期待。</p>
        </div>

        <!-- Single post -->
        <article id="postView" class="max-w-3xl mx-auto hidden">
            <a href="posts.html" id="backLink" class="inline-flex items-center gap-2 text-xs font-mono font-bold text-slate-400 hover:text-cyan-400 transition mb-8">
                ← <span data-i18n="back_all">所有動態</span>
            </a>
            <div id="postContent"></div>
        </article>

    </main>

    <footer class="bg-[#05070B] border-t border-slate-900 py-10 px-6 text-slate-500 text-xs font-mono">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>© 2026 Twinter Labs (www.twinterlabs.com). All Rights Reserved.</p>
            <p>
                <a href="mailto:Twinterlabs@gmail.com" class="text-slate-300 hover:text-cyan-400 transition">Twinterlabs@gmail.com</a>
                <span class="text-slate-700 mx-2">|</span>
                <a href="https://line.me/ti/p/rsc69htRfX" target="_blank" rel="noopener" class="text-slate-300 hover:text-emerald-400 transition">LINE</a>
                <span class="text-slate-700 mx-2">|</span>
                <a href="https://instagram.com/TwinterLabs" target="_blank" rel="noopener" class="text-slate-300 hover:text-pink-400 transition">Instagram</a>
            </p>
        </div>
    </footer>

    <!-- Picture viewer -->
    <div id="lightbox" class="hidden fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-4" onclick="closeLightbox()">
        <button type="button" aria-label="Close" class="absolute top-4 right-4 w-11 h-11 rounded-xl bg-slate-900 border border-slate-700 text-white text-lg">✕</button>
        <button type="button" id="lbPrev" aria-label="Previous" onclick="event.stopPropagation(); stepLightbox(-1)" class="absolute left-3 sm:left-6 w-11 h-11 rounded-xl bg-slate-900 border border-slate-700 text-white text-lg">←</button>
        <img id="lightboxImg" src="" alt="" class="max-w-full max-h-full rounded-xl" onclick="event.stopPropagation()">
        <button type="button" id="lbNext" aria-label="Next" onclick="event.stopPropagation(); stepLightbox(1)" class="absolute right-3 sm:right-6 w-11 h-11 rounded-xl bg-slate-900 border border-slate-700 text-white text-lg">→</button>
    </div>

    <script src="posts.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');
        let currentLang = params.get('lang') === 'en' ? 'en' : 'zh';
        let allPosts = [];
        let lightboxImages = [];
        let lightboxIndex = 0;

        const translations = {
            zh: {
                toggle_btn: 'English',
                back_home: '返回官網首頁 ←',
                nav_cta: '立即訂購',
                list_badge: '最新動態 • 作品更新與公告',
                list_title: 'Twinter Labs 最新動態',
                list_desc: '新上線的網站與 APP、開發中的專案進度，以及我們的最新消息。',
                empty: '目前還沒有貼文，敬請期待。',
                back_all: '所有動態',
                not_found: '找不到這篇貼文，可能已經被移除。',
                page_title: '最新動態 | Twinter Labs'
            },
            en: {
                toggle_btn: '繁體中文',
                back_home: 'Back to home ←',
                nav_cta: 'Order now',
                list_badge: 'Updates • New work and announcements',
                list_title: 'Latest from Twinter Labs',
                list_desc: 'Newly launched websites and apps, progress on current projects, and our latest news.',
                empty: 'No posts yet. Check back soon.',
                back_all: 'All updates',
                not_found: 'This post could not be found. It may have been removed.',
                page_title: 'Updates | Twinter Labs'
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            const url = new URL(window.location.href);
            if (currentLang === 'en') url.searchParams.set('lang', 'en');
            else url.searchParams.delete('lang');
            history.replaceState(null, '', url);
            render();
        }

        function mediaHTML(item, index, isLead) {
            const esc = TLPosts.esc;
            const frame = isLead
                ? 'rounded-2xl overflow-hidden border border-slate-800 bg-black flex justify-center'
                : 'rounded-2xl overflow-hidden border border-slate-800 bg-black aspect-[4/3] flex items-center justify-center';
            if (item.type === 'youtube') {
                return `<div class="rounded-2xl overflow-hidden border border-slate-800 bg-black ${isLead ? 'aspect-video' : 'aspect-[4/3]'}">
                    <iframe src="https://www.youtube-nocookie.com/embed/${esc(item.id)}" title="YouTube video" class="w-full h-full" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>`;
            }
            if (item.type === 'video') {
                return `<div class="${frame}">
                    <video src="${esc(item.src)}${item.poster ? '' : '#t=0.1'}" ${item.poster ? `poster="${esc(item.poster)}"` : ''} controls playsinline preload="metadata" class="${isLead ? 'w-full max-h-[80vh]' : 'w-full h-full object-contain'}"></video>
                </div>`;
            }
            const size = item.w && item.h ? `width="${Number(item.w)}" height="${Number(item.h)}"` : '';
            return `<button type="button" class="${frame} w-full cursor-zoom-in" data-lightbox="${esc(item.src)}" aria-label="View picture">
                <img src="${esc(item.src)}" ${size} alt="" ${index === 0 ? '' : 'loading="lazy"'} class="${isLead ? 'max-w-full w-auto h-auto max-h-[80vh]' : 'w-full h-full object-cover'}">
            </button>`;
        }

        function renderPost(post) {
            const title = TLPosts.pick(post.title, currentLang);
            const body = TLPosts.pick(post.body, currentLang);
            const media = post.media || [];
            lightboxImages = media.filter(item => item.type === 'image').map(item => item.src);

            const lead = media.length ? mediaHTML(media[0], 0, true) : '';
            const rest = media.slice(1);
            const restHtml = rest.length
                ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">${rest.map((item, i) => mediaHTML(item, i + 1, false)).join('')}</div>`
                : '';

            document.title = `${title} | Twinter Labs`;
            document.getElementById('postContent').innerHTML = `
                <span class="font-mono text-xs text-cyan-400 tracking-wider">${TLPosts.esc(TLPosts.formatDate(post.date))}</span>
                <h1 class="font-display text-3xl sm:text-4xl font-bold text-white leading-tight mt-3 mb-8">${TLPosts.esc(title)}</h1>
                ${media.length ? `<div class="mb-10">${lead}${restHtml}</div>` : ''}
                <div class="post-body">${TLPosts.renderBody(body)}</div>`;
        }

        function render() {
            const dict = translations[currentLang];
            const suffix = currentLang === 'en' ? '?lang=en' : '';
            document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key] !== undefined) el.textContent = dict[key];
            });
            document.getElementById('homeLink').href = 'index.html' + suffix;
            document.getElementById('orderLink').href = 'index.html' + suffix + '#quick-request';
            document.getElementById('backLink').href = 'posts.html' + suffix;

            const listView = document.getElementById('listView');
            const postView = document.getElementById('postView');

            if (postId) {
                listView.classList.add('hidden');
                postView.classList.remove('hidden');
                const post = allPosts.find(item => item.id === postId);
                if (post) {
                    renderPost(post);
                } else {
                    document.title = dict.page_title;
                    document.getElementById('postContent').innerHTML =
                        `<p class="text-slate-400 font-mono text-sm py-16 text-center">${TLPosts.esc(dict.not_found)}</p>`;
                }
                return;
            }

            document.title = dict.page_title;
            postView.classList.add('hidden');
            listView.classList.remove('hidden');
            document.getElementById('postGrid').innerHTML = allPosts.map(post => TLPosts.cardHTML(post, currentLang)).join('');
            document.getElementById('emptyState').classList.toggle('hidden', allPosts.length > 0);
        }

        function openLightbox(src) {
            lightboxIndex = Math.max(0, lightboxImages.indexOf(src));
            showLightboxImage();
            document.getElementById('lightbox').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function showLightboxImage() {
            const many = lightboxImages.length > 1;
            document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
            document.getElementById('lbPrev').classList.toggle('hidden', !many);
            document.getElementById('lbNext').classList.toggle('hidden', !many);
        }
        function stepLightbox(step) {
            lightboxIndex = (lightboxIndex + step + lightboxImages.length) % lightboxImages.length;
            showLightboxImage();
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.body.style.overflow = '';
        }
        document.getElementById('postContent').addEventListener('click', event => {
            const trigger = event.target.closest('[data-lightbox]');
            if (trigger) openLightbox(trigger.getAttribute('data-lightbox'));
        });
        document.addEventListener('keydown', event => {
            if (document.getElementById('lightbox').classList.contains('hidden')) return;
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') stepLightbox(-1);
            if (event.key === 'ArrowRight') stepLightbox(1);
        });

        TLPosts.load().then(posts => {
            allPosts = posts;
            render();
        });
    </script>
</body>
</html>
