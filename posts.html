<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新動態 | Twinter Labs</title>
    <meta name="description" content="Twinter Labs 最新動態：新上線的網站與 APP 作品、開發進度與公告。">
    <link rel="canonical" href="https://www.twinterlabs.com/posts.html">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="theme.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>

        /* Text of a single post (HTML comes from TLPosts.renderBody) */
        .post-body { color: var(--ink2); font-size: 17px; line-height: 1.75; overflow-wrap: anywhere; }
        .post-body p { margin: 0 0 1.1em; }
        .post-body h3 { color: var(--ink); font-size: 1.3rem; font-weight: 700; line-height: 1.35; margin: 1.8em 0 0.6em; }
        .post-body ul, .post-body ol { margin: 0 0 1.1em; padding-left: 1.5em; }
        .post-body ul { list-style: disc; }
        .post-body ol { list-style: decimal; }
        .post-body li { margin-bottom: 0.35em; }
        .post-body strong { color: var(--ink); font-weight: 700; }
        .post-body a { color: var(--mint-deep); text-decoration: underline; text-underline-offset: 3px; }
        .post-body a:hover { color: var(--mint-deep); }
        .post-body blockquote { border-left: 3px solid var(--mint); background: var(--mint-soft); padding: 1rem; margin: 1.25rem 0; }
        .post-body code { background: var(--paper); border-radius: 4px; padding: .15em .3em; }
    </style>
</head>
<body class="bg-paper text-ink2 antialiased">

    <nav class="sticky top-0 z-50 bg-card/85 backdrop-blur border-b border-line">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-3">
            <a href="index.html" id="homeLink" class="flex items-center gap-3 whitespace-nowrap">
                <div class="w-10 h-10 shrink-0 rounded-xl bg-mint-soft flex items-center justify-center font-display font-black text-xl text-ink">
                    <img src="images/logo.svg" alt="Twinter Labs logo" class="w-full h-full object-cover rounded-xl">
                </div>
                <div class="hidden sm:block">
                    <span class="font-display text-lg font-bold text-ink block">Twinter Labs</span>
                    <span class="text-[10px] text-mint-deep font-sans block -mt-0.5" data-i18n="back_home">回首頁</span>
                </div>
            </a>
            <div class="flex gap-2 sm:gap-5 whitespace-nowrap text-sm items-center">
                <button type="button" onclick="toggleLanguage()" class="bg-card border border-line text-ink rounded-xl px-4 py-3 font-semibold hover:border-sea min-h-[44px] transition flex items-center gap-1.5 whitespace-nowrap shrink-0">
                    <i class="fa-solid fa-language text-sm text-mint-deep hidden sm:inline"></i>
                    <span data-i18n="toggle_btn">English</span>
                </button>
                <a href="index.html#quick-request" id="orderLink" class="bg-mint text-white rounded-xl px-5 py-3.5 font-semibold hover:bg-mint-deep transition min-h-[48px] w-full sm:w-auto text-center">
                    <span data-i18n="nav_cta">詢價</span> →
                </a>
            </div>
        </div>
    </nav>

    <main class="py-14 sm:py-20 px-5 min-h-[70vh]">

        <!-- All posts -->
        <div id="listView" class="max-w-7xl mx-auto hidden">
            <div class="space-y-3 mb-10">
                <h1 class="font-display text-3xl sm:text-5xl font-bold text-ink" data-i18n="list_title">最近動態</h1>
                <p class="text-muted text-base leading-relaxed" data-i18n="list_desc">看我們最近上線的作品和開發進度。</p>
            </div>
            <div id="postGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <p id="emptyState" class="hidden text-center text-muted font-sans text-sm py-16" data-i18n="empty">目前還沒有貼文。</p>
        </div>

        <!-- Single post -->
        <article id="postView" class="max-w-2xl mx-auto hidden">
            <a href="posts.html" id="backLink" class="inline-flex items-center gap-2 text-sm text-mint-deep font-semibold hover:underline min-h-[44px] transition mb-8">
                ← <span data-i18n="back_all">所有動態</span>
            </a>
            <div id="postContent"></div>
        </article>

    </main>

    <footer class="bg-ink text-white/70 border-t border-line py-10 px-5 text-xs">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>© 2026 Twinter Labs (www.twinterlabs.com). All Rights Reserved.</p>
            <p>
                <a href="mailto:Twinterlabs@gmail.com" class="text-white/70 hover:text-sea-soft transition">Twinterlabs@gmail.com</a>
                <span class="text-white/70 mx-2">|</span>
                <a href="https://line.me/ti/p/rsc69htRfX" target="_blank" rel="noopener" class="text-white/70 hover:text-sea-soft transition">LINE</a>
                <span class="text-white/70 mx-2">|</span>
                <a href="https://instagram.com/TwinterLabs" target="_blank" rel="noopener" class="text-white/70 hover:text-sea-soft transition">Instagram</a>
            </p>
        </div>
    </footer>

    <!-- Picture viewer -->
    <div id="lightbox" class="hidden fixed inset-0 z-[100] bg-ink/95 flex items-center justify-center p-4" onclick="closeLightbox()">
        <button type="button" aria-label="Close" class="absolute top-4 right-4 w-11 h-11 rounded-xl bg-ink border border-line text-white text-lg">✕</button>
        <button type="button" id="lbPrev" aria-label="Previous" onclick="event.stopPropagation(); stepLightbox(-1)" class="absolute left-3 sm:left-6 w-11 h-11 rounded-xl bg-ink border border-line text-white text-lg">←</button>
        <img id="lightboxImg" src="" alt="" class="max-w-full max-h-full rounded-xl" onclick="event.stopPropagation()">
        <button type="button" id="lbNext" aria-label="Next" onclick="event.stopPropagation(); stepLightbox(1)" class="absolute right-3 sm:right-6 w-11 h-11 rounded-xl bg-ink border border-line text-white text-lg">→</button>
    </div>

    <script src="posts.js"></script>
    <script src="site.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');
        let currentLang = params.get('lang') === 'en' ? 'en' : 'zh';
        let allPosts = [];
        let lightboxImages = [];
        let lightboxIndex = 0;

        const translations = {
            zh: {
                toggle_btn: 'English',
                back_home: '回首頁',
                nav_cta: '詢價',
                list_badge: '',
                list_title: '最近動態',
                list_desc: '看我們最近上線的作品和開發進度。',
                empty: '目前還沒有貼文。',
                back_all: '所有動態',
                not_found: '找不到這篇貼文。',
                page_title: '最新動態 | Twinter Labs'
            },
            en: {
                toggle_btn: '繁體中文',
                back_home: 'Back to home ←',
                nav_cta: 'Order now',
                list_badge: 'Updates • New work and announcements',
                list_title: 'Latest from Twinter Labs',
                list_desc: 'Newly launched websites and apps, progress on current projects, and our latest news.',
                empty: 'No posts yet. Check back soon.',
                back_all: 'All updates',
                not_found: 'This post could not be found. It may have been removed.',
                page_title: 'Updates | Twinter Labs'
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            const url = new URL(window.location.href);
            if (currentLang === 'en') url.searchParams.set('lang', 'en');
            else url.searchParams.delete('lang');
            history.replaceState(null, '', url);
            render();
        }

        function mediaHTML(item, index, isLead) {
            const esc = TLPosts.esc;
            const frame = isLead
                ? 'rounded-2xl overflow-hidden border border-line bg-black flex justify-center'
                : 'rounded-2xl overflow-hidden border border-line bg-black aspect-[4/3] flex items-center justify-center';
            if (item.type === 'youtube') {
                return `<div class="rounded-2xl overflow-hidden border border-line bg-ink ${isLead ? 'aspect-video' : 'aspect-[4/3]'}">
                    <iframe src="https://www.youtube-nocookie.com/embed/${esc(item.id)}" title="YouTube video" class="w-full h-full" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>`;
            }
            if (item.type === 'video') {
                return `<div class="${frame}">
                    <video src="${esc(item.src)}${item.poster ? '' : '#t=0.1'}" ${item.poster ? `poster="${esc(item.poster)}"` : ''} controls playsinline preload="metadata" class="${isLead ? 'w-full max-h-[80vh]' : 'w-full h-full object-contain'}"></video>
                </div>`;
            }
            const size = item.w && item.h ? `width="${Number(item.w)}" height="${Number(item.h)}"` : '';
            return `<button type="button" class="${frame} w-full cursor-zoom-in" data-lightbox="${esc(item.src)}" aria-label="View picture">
                <img src="${esc(item.src)}" ${size} alt="" ${index === 0 ? '' : 'loading="lazy"'} class="${isLead ? 'max-w-full w-auto h-auto max-h-[80vh]' : 'w-full h-full object-cover'}">
            </button>`;
        }

        function renderPost(post) {
            const title = TLPosts.pick(post.title, currentLang);
            const body = TLPosts.pick(post.body, currentLang);
            const media = post.media || [];
            lightboxImages = media.filter(item => item.type === 'image').map(item => item.src);

            const lead = media.length ? mediaHTML(media[0], 0, true) : '';
            const rest = media.slice(1);
            const restHtml = rest.length
                ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">${rest.map((item, i) => mediaHTML(item, i + 1, false)).join('')}</div>`
                : '';

            document.title = `${title} | Twinter Labs`;
            document.getElementById('postContent').innerHTML = `
                <span class="text-xs font-semibold uppercase text-mint-deep tracking-wider">${TLPosts.esc(TLPosts.formatDate(post.date))}</span>
                <h1 class="font-display text-3xl sm:text-4xl font-bold text-ink leading-tight mt-3 mb-8">${TLPosts.esc(title)}</h1>
                ${media.length ? `<div class="mb-10">${lead}${restHtml}</div>` : ''}
                <div class="post-body">${TLPosts.renderBody(body)}</div>`;
        }

        function render() {
            const dict = translations[currentLang];
            const suffix = currentLang === 'en' ? '?lang=en' : '';
            document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key] !== undefined) el.textContent = dict[key];
            });
            document.getElementById('homeLink').href = 'index.html' + suffix;
            document.getElementById('orderLink').href = 'index.html' + suffix + '#quick-request';
            document.getElementById('backLink').href = 'posts.html' + suffix;

            const listView = document.getElementById('listView');
            const postView = document.getElementById('postView');

            if (postId) {
                listView.classList.add('hidden');
                postView.classList.remove('hidden');
                const post = allPosts.find(item => item.id === postId);
                if (post) {
                    renderPost(post);
                } else {
                    document.title = dict.page_title;
                    document.getElementById('postContent').innerHTML =
                        `<p class="text-muted font-sans text-sm py-16 text-center">${TLPosts.esc(dict.not_found)}</p>`;
                }
                return;
            }

            document.title = dict.page_title;
            postView.classList.add('hidden');
            listView.classList.remove('hidden');
            document.getElementById('postGrid').innerHTML = allPosts.map(post => TLPosts.cardHTML(post, currentLang)).join('');
            document.getElementById('emptyState').classList.toggle('hidden', allPosts.length > 0);
        }

        function openLightbox(src) {
            lightboxIndex = Math.max(0, lightboxImages.indexOf(src));
            showLightboxImage();
            document.getElementById('lightbox').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function showLightboxImage() {
            const many = lightboxImages.length > 1;
            document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
            document.getElementById('lbPrev').classList.toggle('hidden', !many);
            document.getElementById('lbNext').classList.toggle('hidden', !many);
        }
        function stepLightbox(step) {
            lightboxIndex = (lightboxIndex + step + lightboxImages.length) % lightboxImages.length;
            showLightboxImage();
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.body.style.overflow = '';
        }
        document.getElementById('postContent').addEventListener('click', event => {
            const trigger = event.target.closest('[data-lightbox]');
            if (trigger) openLightbox(trigger.getAttribute('data-lightbox'));
        });
        document.addEventListener('keydown', event => {
            if (document.getElementById('lightbox').classList.contains('hidden')) return;
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') stepLightbox(-1);
            if (event.key === 'ArrowRight') stepLightbox(1);
        });

        TLPosts.load().then(posts => {
            allPosts = posts;
            render();
        });
        // Contact links and the logo changed in admin.html apply here as well
        if (window.TLSite) TLSite.load().then(site => { TLSite.applyLinks(site, document); TLSite.applyImages(site, document); });
    </script>
</body>
</html>
